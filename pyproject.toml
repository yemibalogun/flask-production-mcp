[project]
name = "flask-production-mcp"
version = "0.1.0"
description = "Static production-readiness auditor for Flask apps: architecture, templates, deployment, testing, security, database, dependencies and code quality. CLI, pre-commit hook, GitHub Action and MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Yemi Balogun", email = "slickact2006@gmail.com" }
]
keywords = [
    "flask",
    "mcp",
    "static-analysis",
    "security",
    "linter",
    "production-readiness",
    "audit",
    "pre-commit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.14,<3",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
# The dependency-CVE scan (pip-audit) and the Bandit scan. The audit runs
# without these installed - it reports that the scan was skipped rather
# than crashing - but CI should install them.
scanners = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
]

[project.urls]
Homepage = "https://github.com/yemibalogun/flask-production-mcp"
Repository = "https://github.com/yemibalogun/flask-production-mcp"
Issues = "https://github.com/yemibalogun/flask-production-mcp/issues"

[project.scripts]
flask-production-mcp = "flask_production_mcp:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=1.13",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.5",
]
